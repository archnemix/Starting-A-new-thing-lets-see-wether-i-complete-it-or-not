# Tests
#
# Purpose: proves that every runner works, records its environment into `Actions/out/`,
# and later runs archx's unit and integration tests on Linux, Windows and macOS.

name: tests

on:
  push:
    paths:
      - "Actions/triggers/tests.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-check:
    name: runner check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record runner environment
        shell: bash
        run: |
          label="latest-env/${RUNNER_OS}-${RUNNER_ARCH}"
          python Actions/scripts/env_probe.py "Actions/out/${label}.json"
          {
            echo "trigger intent: $(tail -n 1 Actions/triggers/tests.txt || true)"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            python --version
            python -c "import platform; print(platform.platform())"
          } > "Actions/out/${label}.log"

      - name: Commit results into the repository
        if: always()
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          bash Actions/scripts/commit_results.sh "ci: runner check ${RUNNER_OS}"
