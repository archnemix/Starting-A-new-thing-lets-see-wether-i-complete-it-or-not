# Tests
#
# Purpose: run the suite on Linux, Windows and macOS, and commit the records back into
# Actions/out/test-runs/ so results are readable without the Actions API.
#
# Triggered by editing Actions/triggers/tests.txt, or by a push to archx/** and Tests/**.

name: tests

on:
  push:
    paths:
      - "Actions/triggers/tests.txt"
      - "archx/**"
      - "Tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests and record the result
        shell: bash
        run: |
          python Actions/scripts/run_tests.py "${RUNNER_OS}-py${{ matrix.python }}"

      - name: Commit records into the repository
        if: always()
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          bash Actions/scripts/commit_results.sh "ci: tests ${RUNNER_OS} py${{ matrix.python }}"
